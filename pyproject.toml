[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumscan-sastbot"
version = "1.0.0"
description = "Local-first Application Security and DevSecOps source-code analysis workbench."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.txt"}
authors = [
  {name = "Md Sumon Mahmud", email = "connect.sumon.mahmud@gmail.com"}
]
keywords = ["sast", "appsec", "devsecops", "secure-code-review", "cybersecurity"]
dependencies = [
  "PySide6>=6.7,<7",
  "Pygments>=2.18,<3",
  "edge-tts>=6.1,<8",
  "reportlab>=4.0,<5"
]

[project.urls]
Homepage = "https://www.sumonmahmud.com"
Repository = "https://github.com/creationbd5"
Issues = "https://github.com/creationbd5"

[project.scripts]
sumscan-sastbot = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["sumscan*"]

[tool.setuptools.package-data]
"sumscan.assets" = ["*.svg", "*.png", "*.ico", "icons/*.svg"]
