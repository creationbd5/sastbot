name: Bug report
description: Report a reproducible SumScan SastBot problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, confidential source code or customer data."
  - type: input
    id: version
    attributes:
      label: SumScan version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Windows 10/11", "Kali Linux", "Other Linux"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
